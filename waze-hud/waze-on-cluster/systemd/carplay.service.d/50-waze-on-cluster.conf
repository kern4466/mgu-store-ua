# waze-on-cluster: patchd restarts carplay with SIGKILL to load a changed
# binary. As a success exit it does not fail carplay.service, so its
# OnFailure=mediaddpserver_kill.service does not run.
[Service]
SuccessExitStatus=SIGKILL
